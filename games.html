<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiele | Party Olympiade</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a2e, #090914);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
    }

    .card {
      background: #151528;
      border-radius: 24px;
      padding: 25px;
      margin-top: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid #333;
      background: #090914;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      padding: 14px 22px;
      border-radius: 30px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      background: linear-gradient(45deg, #8B5CF6, #EC4899);
      color: white;
      margin: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #090914;
      margin: 8px 0;
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
    }

    .delete {
      color: red;
      cursor: pointer;
    }

    a {
      color: #8B5CF6;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Spiele verwalten</h1>

    <div class="card">
      <input id="gameName" placeholder="Spiel hinzufügen (z.B. Bierpong)" />
      <button onclick="addGame()">Spiel hinzufügen</button>

      <ul id="gameList"></ul>
    </div>

    <div class="card">
      <button onclick="goToScoreboard()">Zum Scoreboard</button>
    </div>

    <p><a href="lobby.html">Zurück zur Lobby</a></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const storageKey = "party_olympiade_" + code;

    let lobby = JSON.parse(localStorage.getItem(storageKey));

    if (!lobby) {
      alert("Lobby nicht gefunden.");
      window.location.href = "index.html";
    }

    function saveLobby() {
      localStorage.setItem(storageKey, JSON.stringify(lobby));
    }

    function renderGames() {
      const list = document.getElementById("gameList");
      list.innerHTML = "";

      lobby.games.forEach((game, index) => {
        const li = document.createElement("li");

        li.innerHTML = `
          ${game}
          <span class="delete" onclick="removeGame(${index})">✖</span>
        `;

        list.appendChild(li);
      });
    }

    function addGame() {
      const input = document.getElementById("gameName");
      const name = input.value.trim();

      if (!name) {
        alert("Bitte Spiel eingeben.");
        return;
      }

      lobby.games.push(name);
      input.value = "";
      saveLobby();
      renderGames();
    }

    function removeGame(index) {
      lobby.games.splice(index, 1);
      saveLobby();
      renderGames();
    }

    function goToScoreboard() {
      window.location.href = "scoreboard.html?code=" + lobby.code;
    }

    renderGames();
  </script>
</body>
</html>
