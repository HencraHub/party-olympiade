<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiele | Party Olympiade</title>
  <style>
    :root{--bg:#070714;--bg2:#0d1024;--panel:rgba(18,18,36,.82);--panel2:rgba(28,28,56,.56);--border:rgba(255,255,255,.12);--purple:#8b5cf6;--pink:#ec4899;--cyan:#22d3ee;--text:#fff;--muted:#b7bbcc;--danger:#fb7185}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(1200px 720px at 8% 0%,rgba(236,72,153,.22),transparent 70%),radial-gradient(1240px 760px at 92% 6%,rgba(34,211,238,.2),transparent 72%),linear-gradient(166deg,var(--bg2),var(--bg))}
    .page{width:min(1540px,96vw);margin:30px auto 40px}.glass{border:1px solid var(--border);background:linear-gradient(138deg,var(--panel),var(--panel2));backdrop-filter:blur(20px)}
    .header{min-height:98px;border-radius:26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:16px 26px;position:relative}.header::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:linear-gradient(108deg,rgba(236,72,153,.28),transparent 34%,rgba(34,211,238,.26));filter:blur(18px);opacity:.58;z-index:-1}
    .brand-logo{height:clamp(58px,5vw,68px)} .nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}.nav a{color:#c5c8d6;text-decoration:none;padding:8px 12px;border-radius:999px}.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:999px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none}
    .btn-primary{color:#fff;background:linear-gradient(100deg,rgba(139,92,246,.95),rgba(236,72,153,.96));box-shadow:0 0 38px rgba(236,72,153,.5)}.btn-secondary{color:var(--cyan);border-color:rgba(34,211,238,.64);background:linear-gradient(120deg,rgba(34,211,238,.1),rgba(34,211,238,.04))}
    .layout{margin-top:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
    .panel{border-radius:26px;padding:24px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(16,16,36,.85),rgba(24,24,52,.56));box-shadow:0 0 36px rgba(34,211,238,.14),0 0 36px rgba(236,72,153,.12)}
    h1{margin:0 0 16px;font-size:clamp(34px,3vw,46px)} .muted{color:var(--muted)}
    .search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:#090914;color:#fff}
    .add-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
    .error{color:var(--danger);min-height:18px;margin-top:8px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;max-height:430px;overflow:auto;padding-right:4px}
    .game-item,.selected-item{display:flex;justify-content:space-between;gap:8px;align-items:center;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
    .left{display:flex;align-items:center;gap:9px;min-width:0}.icon{font-size:20px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mode{font-size:.72rem;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2)} .mode.team{color:#22d3ee}.mode.ffa{color:#f9a8d4}
    .delete{border:none;background:transparent;color:#fb7185;font-size:18px;cursor:pointer}
    .selected-list{display:grid;gap:10px}.empty{color:var(--muted);padding:12px}
    .footer-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    @media (max-width:1080px){.header{grid-template-columns:1fr;justify-items:center;text-align:center}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.add-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="page">
  <header class="header glass">
    <a href="index.html"><img class="brand-logo" src="assets/logo-party-olympiade.png" alt="Party Olympiade"/></a>
    <nav class="nav"><a id="backToLobby" href="#">Zur Lobby</a><a href="index.html#how">Ablauf</a><a href="create.html">Neue Lobby</a></nav>
    <div><button class="btn btn-secondary" onclick="goToScoreboard()">Zum Scoreboard</button></div>
  </header>

  <main class="layout">
    <section class="panel glass">
      <h1>Spiele auswählen</h1>
      <input class="search" id="searchInput" placeholder="Spiel suchen..." oninput="renderAvailableGames()" />
      <div class="add-row">
        <input class="search" id="customGame" placeholder="Eigenes Spiel hinzufügen (max. 40 Zeichen)" maxlength="40" />
        <button class="btn btn-primary" onclick="addCustomGame()">Eigenes Spiel hinzufügen</button>
      </div>
      <div id="error" class="error"></div>
      <div class="muted">Nur der Host sollte Spiele hinzufügen/entfernen.</div>
      <div class="grid" id="availableGames"></div>
    </section>

    <aside class="panel glass">
      <h2>Ausgewählte Spiele</h2>
      <div id="selectedGames" class="selected-list"></div>
      <div class="footer-actions">
        <button class="btn btn-primary" onclick="goToScoreboard()">Weiter zum Scoreboard</button>
      </div>
    </aside>
  </main>
</div>

<script>
  const baseGames = [
    { name: "Among Us", icon: "🎮", mode: "ffa" },
    { name: "Codenames", icon: "👥", mode: "team" },
    { name: "EA FC", icon: "⚽", mode: "ffa" },
    { name: "EA FC", icon: "⚽", mode: "team" },
    { name: "Gartic Phone", icon: "✏️", mode: "ffa" },
    { name: "GeoGuessr", icon: "🌍", mode: "ffa" },
    { name: "Mario Kart", icon: "🏎", mode: "ffa" },
    { name: "Quiz", icon: "🧠", mode: "ffa" },
    { name: "Rocket League", icon: "🚗", mode: "team" },
    { name: "Skribbl.io", icon: "🎨", mode: "ffa" },
    { name: "Trackmania", icon: "🏁", mode: "ffa" }
  ];

  const code = (new URLSearchParams(window.location.search).get("code") || "").toUpperCase();
  if (!code) window.location.href = "index.html";

  const storageKey = "party_olympiade_" + code;
  let lobby = JSON.parse(localStorage.getItem(storageKey));
  if (!lobby) { alert("Lobby nicht gefunden."); window.location.href = "index.html"; }

  function showError(msg){document.getElementById('error').innerText=msg||''}
  function makeId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)); }

  function normalizeLobby() {
    lobby.players = Array.isArray(lobby.players) ? lobby.players : [];
    lobby.games = Array.isArray(lobby.games) ? lobby.games : [];
    lobby.results = Array.isArray(lobby.results) ? lobby.results : [];
    lobby.tieRule = lobby.tieRule || "tiebreaker";
    lobby.extraRules = lobby.extraRules || { comebackPenalty:false,lastPlaceBonus:false,winStreakBonus:false,finalDoublePoints:false };
    lobby.customLibrary = Array.isArray(lobby.customLibrary) ? lobby.customLibrary : [];
    lobby.games = lobby.games.map((g)=> typeof g==='string' ? {id:makeId(),name:g,icon:'🎮',mode:'ffa'} : {id:g.id||makeId(),name:(g.name||'').trim(),icon:g.icon||'🎮',mode:g.mode==='team'?'team':'ffa'}).filter((g)=>g.name);
  }

  function saveLobby() { localStorage.setItem(storageKey, JSON.stringify(lobby)); }
  function compareGames(a,b){const n=a.name.localeCompare(b.name,'de'); return n!==0?n:a.mode.localeCompare(b.mode,'de');}

  let visibleGames=[];

  function renderAvailableGames(){
    const search=document.getElementById('searchInput').value.trim().toLowerCase();
    const list=document.getElementById('availableGames');
    list.innerHTML='';
    const merged=[...baseGames,...lobby.customLibrary].sort(compareGames);
    visibleGames=merged.filter((g)=>!search||g.name.toLowerCase().includes(search));
    if(!visibleGames.length){ list.innerHTML='<div class="empty">Keine Spiele gefunden.</div>'; return; }
    visibleGames.forEach((g,i)=>{
      const row=document.createElement('div'); row.className='game-item';
      row.innerHTML=`<div class="left"><span class="icon">${g.icon}</span><span class="name">${g.name}</span><span class="mode ${g.mode}">${g.mode.toUpperCase()}</span></div><button class="btn btn-secondary" onclick="addGameFromList(${i})">Hinzufügen</button>`;
      list.appendChild(row);
    });
  }

  function addGameFromList(i){const g=visibleGames[i]; if(g) addGameToLobby(g)}

  function addGameToLobby(game){
    const exists=lobby.games.some((g)=>g.name.toLowerCase()===game.name.toLowerCase()&&g.mode===game.mode);
    if(exists) return showError('Dieses Spiel ist bereits in der Lobby.');
    lobby.games.push({id:makeId(),name:game.name,icon:game.icon||'🎮',mode:game.mode==='team'?'team':'ffa'});
    showError('');
    saveLobby(); renderSelectedGames();
  }

  function addCustomGame(){
    showError('');
    const name=document.getElementById('customGame').value.trim();
    if(!name) return showError('Spielname darf nicht leer sein.');
    if(name.length>40) return showError('Spielname darf maximal 40 Zeichen haben.');

    const existsLobby=lobby.games.some((g)=>g.name.toLowerCase()===name.toLowerCase());
    if(existsLobby) return showError('Spielname bereits in der Lobby vorhanden.');

    const entry={name,icon:'🎮',mode:'ffa'};
    const existsLib=lobby.customLibrary.some((g)=>g.name.toLowerCase()===name.toLowerCase()&&g.mode==='ffa');
    if(!existsLib) lobby.customLibrary.push(entry);

    document.getElementById('customGame').value='';
    saveLobby();
    renderAvailableGames();
    addGameToLobby(entry);
  }

  function renderSelectedGames(){
    const list=document.getElementById('selectedGames'); list.innerHTML='';
    if(lobby.games.length===0){list.innerHTML='<div class="empty">Noch kein Spiel hinzugefügt.</div>'; return;}
    [...lobby.games].sort(compareGames).forEach((g)=>{
      const row=document.createElement('div'); row.className='selected-item';
      row.innerHTML=`<div class="left"><span class="icon">${g.icon}</span><span class="name">${g.name}</span><span class="mode ${g.mode}">${g.mode.toUpperCase()}</span></div><button class="delete" onclick="removeGame('${g.id}')">✖</button>`;
      list.appendChild(row);
    });
  }

  function removeGame(id){
    const removed=lobby.games.find((g)=>g.id===id);
    lobby.games=lobby.games.filter((g)=>g.id!==id);
    lobby.results=lobby.results.filter((r)=>r.gameId!==id && !(removed && r.game===removed.name && r.mode===removed.mode));
    saveLobby(); renderSelectedGames();
  }

  function goToScoreboard(){window.location.href='scoreboard.html?code='+lobby.code}

  normalizeLobby();
  saveLobby();
  document.getElementById('backToLobby').href='lobby.html?code='+lobby.code;
  renderAvailableGames();
  renderSelectedGames();
</script>
</body>
</html>
