<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiele | Party Olympiade</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #1a1a2e, #090914); color: white; text-align: center; }
    .container { max-width: 820px; margin: auto; padding: 50px 20px; }
    .card { background: #151528; border-radius: 24px; padding: 20px; margin-top: 20px; text-align: left; }
    input { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #333; background: #090914; color: white; box-sizing: border-box; margin-bottom: 10px; }
    button { padding: 12px 16px; border-radius: 30px; border: none; font-size: 14px; cursor: pointer; font-weight: bold; background: linear-gradient(45deg, #8b5cf6, #ec4899); color: white; }
    .game-list { max-height: 340px; overflow: auto; }
    .game-item,.selected-item { display: flex; justify-content: space-between; align-items: center; background: #090914; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
    .game-left { display: flex; align-items: center; gap: 10px; }
    .icon { font-size: 20px; }
    .mode { font-size: 12px; color: #bcbcd1; margin-left: 8px; }
    .small { color: #bcbcd1; font-size: 14px; }
    .delete { border: none; background: transparent; color: #fb7185; font-size: 18px; cursor: pointer; }
    .error{color:#fb7185;min-height:18px;font-size:14px}
    a { color: #22d3ee; text-decoration: none; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Spiele verwalten</h1>
    <div class="card">
      <input id="searchInput" placeholder="Spiel suchen..." oninput="renderAvailableGames()" />
      <div style="display:flex; gap:8px;">
        <input id="customGame" placeholder="Eigenes Spiel hinzufügen (max. 40 Zeichen)" maxlength="40" />
        <button onclick="addCustomGame()">Hinzufügen</button>
      </div>
      <div id="error" class="error"></div>
      <p class="small">Eigene Spiele bekommen automatisch 🎮 und Modus FFA.</p>
      <div class="game-list" id="availableGames"></div>
    </div>

    <div class="card">
      <h3>Zur Lobby hinzugefügte Spiele</h3>
      <div id="selectedGames"></div>
    </div>

    <div class="card center"><button onclick="goToScoreboard()">Zum Scoreboard</button></div>
    <p><a id="backToLobby" href="#">← Zurück zur Lobby</a></p>
  </div>

  <script>
    const baseGames = [
      { name: "Among Us", icon: "🎮", mode: "ffa" },
      { name: "Codenames", icon: "👥", mode: "team" },
      { name: "EA FC", icon: "⚽", mode: "ffa" },
      { name: "EA FC", icon: "⚽", mode: "team" },
      { name: "Gartic Phone", icon: "✏️", mode: "ffa" },
      { name: "GeoGuessr", icon: "🌍", mode: "ffa" },
      { name: "Mario Kart", icon: "🏎", mode: "ffa" },
      { name: "Quiz", icon: "🧠", mode: "ffa" },
      { name: "Rocket League", icon: "🚗", mode: "team" },
      { name: "Skribbl.io", icon: "🎨", mode: "ffa" },
      { name: "Trackmania", icon: "🏁", mode: "ffa" }
    ];

    const code = (new URLSearchParams(window.location.search).get("code") || "").toUpperCase();
    if (!code) window.location.href = "index.html";

    const storageKey = "party_olympiade_" + code;
    let lobby = JSON.parse(localStorage.getItem(storageKey));
    if (!lobby) { alert("Lobby nicht gefunden."); window.location.href = "index.html"; }

    function showError(msg){document.getElementById('error').innerText=msg||''}
    function makeId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)); }

    function normalizeLobby() {
      lobby.players = Array.isArray(lobby.players) ? lobby.players : [];
      lobby.games = Array.isArray(lobby.games) ? lobby.games : [];
      lobby.results = Array.isArray(lobby.results) ? lobby.results : [];
      lobby.tieRule = lobby.tieRule || "tiebreaker";
      lobby.extraRules = lobby.extraRules || { comebackPenalty:false,lastPlaceBonus:false,winStreakBonus:false,finalDoublePoints:false };
      lobby.customLibrary = Array.isArray(lobby.customLibrary) ? lobby.customLibrary : [];
      lobby.games = lobby.games.map((g)=> typeof g==='string' ? {id:makeId(),name:g,icon:'🎮',mode:'ffa'} : {id:g.id||makeId(),name:(g.name||'').trim(),icon:g.icon||'🎮',mode:g.mode==='team'?'team':'ffa'}).filter((g)=>g.name);
    }

    function saveLobby() { localStorage.setItem(storageKey, JSON.stringify(lobby)); }
    function compareGames(a,b){const n=a.name.localeCompare(b.name,'de'); return n!==0?n:a.mode.localeCompare(b.mode,'de');}

    let visibleGames=[];

    function renderAvailableGames(){
      const search=document.getElementById('searchInput').value.trim().toLowerCase();
      const list=document.getElementById('availableGames');
      list.innerHTML='';
      const merged=[...baseGames,...lobby.customLibrary].sort(compareGames);
      visibleGames=merged.filter((g)=>!search||g.name.toLowerCase().includes(search));
      visibleGames.forEach((g,i)=>{
        const row=document.createElement('div'); row.className='game-item';
        row.innerHTML=`<div class="game-left"><span class="icon">${g.icon}</span><span>${g.name} <span class="mode">(${g.mode.toUpperCase()})</span></span></div><button onclick="addGameFromList(${i})">Auswählen</button>`;
        list.appendChild(row);
      });
    }

    function addGameFromList(i){const g=visibleGames[i]; if(g) addGameToLobby(g)}

    function addGameToLobby(game){
      const exists=lobby.games.some((g)=>g.name.toLowerCase()===game.name.toLowerCase()&&g.mode===game.mode);
      if(exists) return showError('Dieses Spiel ist bereits in der Lobby.');
      lobby.games.push({id:makeId(),name:game.name,icon:game.icon||'🎮',mode:game.mode==='team'?'team':'ffa'});
      showError('');
      saveLobby(); renderSelectedGames();
    }

    function addCustomGame(){
      showError('');
      const name=document.getElementById('customGame').value.trim();
      if(!name) return showError('Spielname darf nicht leer sein.');
      if(name.length>40) return showError('Spielname darf maximal 40 Zeichen haben.');

      const existsLobby=lobby.games.some((g)=>g.name.toLowerCase()===name.toLowerCase());
      if(existsLobby) return showError('Spielname bereits in der Lobby vorhanden.');

      const entry={name,icon:'🎮',mode:'ffa'};
      const existsLib=lobby.customLibrary.some((g)=>g.name.toLowerCase()===name.toLowerCase()&&g.mode==='ffa');
      if(!existsLib) lobby.customLibrary.push(entry);

      document.getElementById('customGame').value='';
      saveLobby();
      renderAvailableGames();
      addGameToLobby(entry);
    }

    function renderSelectedGames(){
      const list=document.getElementById('selectedGames'); list.innerHTML='';
      if(lobby.games.length===0){list.innerHTML='<p class="small">Noch kein Spiel hinzugefügt.</p>'; return;}
      [...lobby.games].sort(compareGames).forEach((g)=>{
        const row=document.createElement('div'); row.className='selected-item';
        row.innerHTML=`<div class="game-left"><span class="icon">${g.icon}</span><span>${g.name} <span class="mode">(${g.mode.toUpperCase()})</span></span></div><button class="delete" onclick="removeGame('${g.id}')">✖</button>`;
        list.appendChild(row);
      });
    }

    function removeGame(id){
      const removed=lobby.games.find((g)=>g.id===id);
      lobby.games=lobby.games.filter((g)=>g.id!==id);
      lobby.results=lobby.results.filter((r)=>r.gameId!==id && !(removed && r.game===removed.name && r.mode===removed.mode));
      saveLobby(); renderSelectedGames();
    }

    function goToScoreboard(){window.location.href='scoreboard.html?code='+lobby.code}

    normalizeLobby();
    saveLobby();
    document.getElementById('backToLobby').href='lobby.html?code='+lobby.code;
    renderAvailableGames();
    renderSelectedGames();
  </script>
</body>
</html>
