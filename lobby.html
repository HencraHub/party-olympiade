<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby | Party Olympiade</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1a1a2e,#090914);color:white;text-align:center}
    .container{max-width:700px;margin:auto;padding:50px 20px}
    .code{font-size:clamp(2rem,10vw,3rem);font-weight:bold;color:#facc15;letter-spacing:5px}
    .card{background:#151528;border-radius:20px;padding:20px;margin-top:20px}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#090914;color:white;box-sizing:border-box;margin-bottom:8px}
    button{padding:12px 18px;border-radius:30px;border:none;background:linear-gradient(45deg,#8b5cf6,#ec4899);color:white;font-weight:bold;cursor:pointer}
    li{list-style:none;background:#090914;border-radius:10px;padding:10px;margin:6px 0;text-align:left}
    .error{color:#fb7185;min-height:18px;font-size:14px}
    a{color:#22d3ee;text-decoration:none}
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Lobby</h1>
    <p>Code teilen:</p>
    <div class="code" id="code">----</div>
    <button onclick="copyInvite()">Einladungslink kopieren</button>

    <div class="card">
      <h2>Spieler</h2>
      <ul id="players"></ul>
      <input id="playerName" placeholder="Spielername (max. 20 Zeichen)" maxlength="20" />
      <div id="error" class="error"></div>
      <button onclick="addPlayer()">Spieler hinzufügen</button>
    </div>

    <div class="card">
      <button onclick="window.location.href='games.html?code=' + lobby.code">Spiele verwalten</button>
    </div>

    <p><a href="index.html">← Zurück zur Startseite</a></p>
  </div>

  <script>
    const code = (new URLSearchParams(window.location.search).get("code") || "").toUpperCase();
    if (!code) window.location.href = "index.html";

    const storageKey = "party_olympiade_" + code;
    let lobby = JSON.parse(localStorage.getItem(storageKey));
    if (!lobby) { alert("Lobby nicht gefunden."); window.location.href = "index.html"; }

    function normalizeLobby() {
      lobby.players = Array.isArray(lobby.players) ? lobby.players : [];
      lobby.games = Array.isArray(lobby.games) ? lobby.games : [];
      lobby.results = Array.isArray(lobby.results) ? lobby.results : [];
      if (!lobby.tieRule) lobby.tieRule = "tiebreaker";
      if (!lobby.extraRules) {
        lobby.extraRules = { comebackPenalty: false, lastPlaceBonus: false, winStreakBonus: false, finalDoublePoints: false };
      }
    }

    function saveLobby() {
      localStorage.setItem(storageKey, JSON.stringify(lobby));
      localStorage.setItem("party_olympiade_last_code", lobby.code);
    }

    function showError(msg) { document.getElementById("error").innerText = msg || ""; }

    function renderPlayers() {
      const list = document.getElementById("players");
      list.innerHTML = "";
      lobby.players.forEach((p) => {
        const li = document.createElement("li");
        li.innerText = p;
        list.appendChild(li);
      });
    }

    function addPlayer() {
      showError("");
      const input = document.getElementById("playerName");
      const name = input.value.trim();
      if (!name) return showError("Spielername darf nicht leer sein.");
      if (name.length > 20) return showError("Spielername darf maximal 20 Zeichen haben.");
      if (lobby.players.some((p) => p.toLowerCase() === name.toLowerCase())) return showError("Spielername existiert bereits.");

      lobby.players.push(name);
      input.value = "";
      saveLobby();
      renderPlayers();
    }

    function copyInvite() {
      const link = `${window.location.origin}${window.location.pathname.replace('lobby.html','lobby.html')}?code=${lobby.code}`;
      navigator.clipboard.writeText(link).then(() => alert("Einladungslink kopiert.")).catch(() => alert("Kopieren fehlgeschlagen."));
    }

    normalizeLobby();
    saveLobby();
    document.getElementById("title").innerText = lobby.lobbyName;
    document.getElementById("code").innerText = lobby.code;
    renderPlayers();
  </script>
</body>
</html>
