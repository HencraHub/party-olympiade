<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gewinner | Party Olympiade</title>
  <style>
    :root{--bg:#070714;--bg2:#0d1024;--panel:rgba(18,18,36,.82);--panel2:rgba(28,28,56,.56);--border:rgba(255,255,255,.12);--purple:#8b5cf6;--pink:#ec4899;--cyan:#22d3ee;--text:#fff;--muted:#b7bbcc;--ok:#34d399}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(1200px 720px at 8% 0%,rgba(236,72,153,.22),transparent 70%),radial-gradient(1240px 760px at 92% 6%,rgba(34,211,238,.2),transparent 72%),linear-gradient(166deg,var(--bg2),var(--bg))}
    .page{width:min(1540px,96vw);margin:30px auto 36px}.glass{border:1px solid var(--border);background:linear-gradient(138deg,var(--panel),var(--panel2));backdrop-filter:blur(20px)}
    .hero{border-radius:30px;padding:28px;position:relative;overflow:hidden}.hero::before{content:"";position:absolute;inset:-120px;background:radial-gradient(circle at 50% 20%,rgba(250,204,21,.25),transparent 55%);z-index:-1}
    h1{margin:0;font-size:clamp(44px,4.4vw,72px);text-align:center}
    .champ{margin-top:14px;text-align:center;padding:20px;border-radius:22px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#1b1200;box-shadow:0 0 40px rgba(250,204,21,.38)}
    .champ .name{font-size:clamp(34px,3.5vw,54px);font-weight:800}
    .podium{margin-top:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
    .podium .card{border-radius:18px;padding:16px;background:rgba(9,10,20,.82);border:1px solid rgba(255,255,255,.14);text-align:center}
    .p1{border-color:rgba(250,204,21,.5)} .p2{border-color:rgba(226,232,240,.45)} .p3{border-color:rgba(251,146,60,.45)}
    .table-wrap{margin-top:22px;border-radius:22px;padding:20px}
    table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #2a2a48;text-align:left}th{color:#22d3ee}
    .actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:999px;border:1px solid transparent;font-weight:700;cursor:pointer}
    .btn-primary{color:#fff;background:linear-gradient(100deg,rgba(139,92,246,.95),rgba(236,72,153,.96));box-shadow:0 0 32px rgba(236,72,153,.45)}
    .btn-secondary{color:var(--cyan);border-color:rgba(34,211,238,.64);background:linear-gradient(120deg,rgba(34,211,238,.1),rgba(34,211,238,.04))}
    .ok{color:var(--ok);min-height:18px;text-align:center;margin-top:8px}
    .chars{display:flex;justify-content:space-between;margin-top:8px;opacity:.9}.chars img{height:82px;filter:drop-shadow(0 0 20px rgba(139,92,246,.4))}
    @media (max-width:980px){.podium{grid-template-columns:1fr}.chars{display:none}}
  </style>
</head>
<body>
<div class="page">
  <section class="hero glass">
    <h1>Finale der Olympiade</h1>
    <p id="lobbyName" style="text-align:center;color:#c9cde0"></p>

    <div class="champ" id="winnerCard"></div>

    <div class="podium" id="podiumSmall"></div>

    <div class="chars" aria-hidden="true">
      <img src="assets/character-pink.png" alt=""/>
      <img src="assets/character-green.png" alt=""/>
    </div>

    <div class="table-wrap glass">
      <h3>Komplette Rangliste</h3>
      <table>
        <thead><tr><th>#</th><th>Spieler</th><th>Gesamt</th><th>Grundpunkte</th><th>Bonus/Strafe</th><th>Siege</th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.href='index.html'">Neue Olympiade starten</button>
      <button class="btn btn-secondary" id="backBtn">Zurück zum Scoreboard</button>
      <button class="btn btn-secondary" onclick="copyResult()">Ergebnis kopieren</button>
    </div>
    <div id="copyMsg" class="ok"></div>
  </section>
</div>

<script>
  const code = (new URLSearchParams(window.location.search).get('code') || '').toUpperCase();
  if (!code) window.location.href = 'index.html';

  const lobby = JSON.parse(localStorage.getItem('party_olympiade_' + code));
  if (!lobby) { alert('Lobby nicht gefunden.'); window.location.href = 'index.html'; }

  function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));}

  function normalizeLobby() {
    lobby.players = Array.isArray(lobby.players) ? lobby.players : [];
    lobby.games = Array.isArray(lobby.games) ? lobby.games : [];
    lobby.results = Array.isArray(lobby.results) ? lobby.results : [];
    lobby.tieRule = lobby.tieRule || 'tiebreaker';
    lobby.extraRules = {
      comebackPenalty: !!(lobby.extraRules && lobby.extraRules.comebackPenalty),
      lastPlaceBonus: !!(lobby.extraRules && lobby.extraRules.lastPlaceBonus),
      winStreakBonus: !!(lobby.extraRules && lobby.extraRules.winStreakBonus),
      finalDoublePoints: !!(lobby.extraRules && lobby.extraRules.finalDoublePoints)
    };
    lobby.games = lobby.games.map((g)=> typeof g==='string' ? {id:makeId(),name:g,icon:'🎮',mode:'ffa'} : {id:g.id||makeId(),name:g.name||'Spiel',icon:g.icon||'🎮',mode:g.mode==='team'?'team':'ffa'});
  }

  function rankRows(rows){ return [...rows].sort((a,b)=>b.total-b.total || b.wins-a.wins || a.name.localeCompare(b.name)); }

  function getUniqueLeaderAndLast(rows){
    const sorted=rankRows(rows);
    if(!sorted.length) return {leader:null,last:null,hasClearLeader:false,hasClearLast:false};
    const leader=sorted[0], last=sorted[sorted.length-1];
    return { leader,last, hasClearLeader: sorted.filter((r)=>r.total===leader.total).length===1, hasClearLast: sorted.filter((r)=>r.total===last.total).length===1 };
  }

  function getResultForGame(game){ return lobby.results.find((r)=>r.gameId===game.id) || null; }

  function recalculateRanking() {
    const players = lobby.players.map((name)=>({name,total:0,base:0,bonus:0,wins:0}));
    let previousFfaWinners = new Set(); let playedGames = 0;

    lobby.games.forEach((game,index)=>{
      const result=getResultForGame(game); if(!result) return;
      const mult=lobby.extraRules.finalDoublePoints && index===lobby.games.length-1 ? 2 : 1;

      if(game.mode==='ffa'){
        const before=getUniqueLeaderAndLast(players);
        const grouped={1:[],2:[],3:[]};
        (result.placements||[]).forEach((p)=>{ if(grouped[p.place]) grouped[p.place].push(p.player); });
        const top3=new Set([...grouped[1],...grouped[2],...grouped[3]]);

        [[1,3],[2,2],[3,1]].forEach(([place,pts])=>grouped[place].forEach((player)=>{ const row=players.find((r)=>r.name===player); if(row){row.base+=pts*mult;row.total+=pts*mult;if(place===1)row.wins+=1;} }));

        if(playedGames>0 && lobby.extraRules.comebackPenalty && before.hasClearLeader && !top3.has(before.leader.name)){ const row=players.find((r)=>r.name===before.leader.name); if(row){row.bonus-=2;row.total-=2;} }
        if(playedGames>0 && lobby.extraRules.lastPlaceBonus && before.hasClearLast && top3.has(before.last.name)){ const row=players.find((r)=>r.name===before.last.name); if(row){row.bonus+=1;row.total+=1;} }

        const firstSet=new Set(grouped[1]);
        if(lobby.extraRules.winStreakBonus){ firstSet.forEach((p)=>{ if(previousFfaWinners.has(p)){ const row=players.find((r)=>r.name===p); if(row){row.bonus+=1;row.total+=1;} } }); }
        previousFfaWinners=firstSet;
      } else {
        (result.teamA||[]).forEach((p)=>{ const row=players.find((r)=>r.name===p); if(row){ const pts=result.winnerTeam==='A'?2*mult:0; row.base+=pts; row.total+=pts; if(pts>0) row.wins+=1; } });
        (result.teamB||[]).forEach((p)=>{ const row=players.find((r)=>r.name===p); if(row){ const pts=result.winnerTeam==='B'?2*mult:0; row.base+=pts; row.total+=pts; if(pts>0) row.wins+=1; } });
      }
      playedGames += 1;
    });

    return rankRows(players);
  }

  const ranking = (normalizeLobby(), recalculateRanking());

  function render() {
    document.getElementById('lobbyName').innerText = lobby.lobbyName;
    document.getElementById('backBtn').onclick = () => window.location.href = 'scoreboard.html?code=' + lobby.code;

    const winner = ranking[0];
    document.getElementById('winnerCard').innerHTML = winner
      ? `<div>Champion</div><div class="name">${winner.name}</div><div>${winner.total} Punkte</div>`
      : '<p>Noch keine Ergebnisse vorhanden.</p>';

    const small = document.getElementById('podiumSmall');
    small.innerHTML = '';
    const second = ranking[1], third = ranking[2];
    if (winner) small.innerHTML += `<div class="card p1"><strong>Platz 1</strong><br>${winner.name}<br>${winner.total} Punkte</div>`;
    if (second) small.innerHTML += `<div class="card p2"><strong>Platz 2</strong><br>${second.name}<br>${second.total} Punkte</div>`;
    if (third) small.innerHTML += `<div class="card p3"><strong>Platz 3</strong><br>${third.name}<br>${third.total} Punkte</div>`;

    const body = document.getElementById('rankingBody');
    body.innerHTML = '';
    ranking.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i+1}</td><td>${r.name}</td><td>${r.total}</td><td>${r.base}</td><td>${r.bonus>0?'+':''}${r.bonus}</td><td>${r.wins}</td>`;
      body.appendChild(tr);
    });
  }

  function copyResult(){
    const top = ranking.slice(0,3);
    const text = ['Party-Olympiade Ergebnis:']
      .concat(top.map((r,i)=>`${i+1}. ${r.name} - ${r.total} Punkte`))
      .join('\n');
    navigator.clipboard.writeText(text).then(()=>{document.getElementById('copyMsg').innerText='Ergebnis kopiert.';}).catch(()=>{document.getElementById('copyMsg').innerText='Kopieren fehlgeschlagen.';});
  }

  render();
</script>
</body>
</html>
