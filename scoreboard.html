<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scoreboard | Party Olympiade</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="page">
  <header class="header glass">
    <a href="index.html"><img class="brand-logo" src="assets/logo-party-olympiade.png" alt="Party Olympiade"/></a>
    <nav class="nav"><a id="backToGames" href="#">Spiele</a><a href="lobby.html">Lobby</a><a href="winner.html">Finale</a></nav>
    <div><button class="btn btn-secondary" onclick="window.location.href='winner.html?code='+lobby.code">Olympiade beenden</button></div>
  </header>

  <main class="dash">
    <section class="panel glass">
      <h1>Host-Steuerung</h1>
      <div class="info-pill">Host-only Aktionen</div>
      <div id="lobbyName" class="muted"></div>
      <h2>Fortschritt</h2>
      <div id="progressText" class="progress muted">Fortschritt: ░░░░░░░░░░ 0%</div>
      <div id="progressDetail" class="muted">Spiel 0 von 0</div>
      <div id="currentGame" class="muted"></div>
      <div class="random-wrap">
        <button class="btn btn-primary" onclick="pickRandomGame()">Random-Spiel starten</button>
        <div id="randomResult" class="random-highlight muted">Noch kein Random-Spiel gewählt.</div>
      </div>
    </section>

    <section class="panel glass">
      <h2>Zentrales Scoreboard</h2>
      <table>
        <thead><tr><th>#</th><th>Spieler</th><th>Gesamt</th><th>Grundpunkte</th><th>Bonus/Strafe</th><th>Siege</th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
      <h3>Bonus-/Malus-Log</h3>
      <div id="logArea" class="muted"></div>
    </section>

    <section class="panel glass">
      <h2>Ergebnis eintragen</h2>
      <select id="gameSelect" onchange="renderForm()"></select>
      <div id="hint" class="muted"></div>
      <div id="formArea"></div>
      <div id="formError" class="error"></div>
      <div class="actions">
        <button id="saveBtn" class="btn btn-primary" onclick="saveResult()">Ergebnis speichern</button>
        <button class="btn btn-secondary" onclick="resetResults()">Ergebnisse zurücksetzen</button>
      </div>
    </section>
  </main>
</div>

<script>
  const code = (new URLSearchParams(window.location.search).get("code") || "").toUpperCase();
  if (!code) window.location.href = "index.html";

  const storageKey = "party_olympiade_" + code;
  let lobby = JSON.parse(localStorage.getItem(storageKey));
  if (!lobby) { alert("Lobby nicht gefunden."); window.location.href = "index.html"; }

  function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));}

  function normalizeLobby() {
    lobby.players = Array.isArray(lobby.players) ? lobby.players : [];
    lobby.games = Array.isArray(lobby.games) ? lobby.games : [];
    lobby.results = Array.isArray(lobby.results) ? lobby.results : [];
    lobby.tieRule = lobby.tieRule || "tiebreaker";
    lobby.extraRules = {
      comebackPenalty: !!(lobby.extraRules && lobby.extraRules.comebackPenalty),
      lastPlaceBonus: !!(lobby.extraRules && lobby.extraRules.lastPlaceBonus),
      winStreakBonus: !!(lobby.extraRules && lobby.extraRules.winStreakBonus),
      finalDoublePoints: !!(lobby.extraRules && lobby.extraRules.finalDoublePoints)
    };
    lobby.games = lobby.games.map((g)=> typeof g==='string' ? {id:makeId(),name:g,icon:'🎮',mode:'ffa'} : {id:g.id||makeId(),name:g.name||'Spiel',icon:g.icon||'🎮',mode:g.mode==='team'?'team':'ffa'});
  }

  function saveLobby(){ localStorage.setItem(storageKey, JSON.stringify(lobby)); }
  function showError(msg){ document.getElementById('formError').innerText = msg || ''; }

  function getResultForGame(game){ return lobby.results.find((r)=>r.gameId===game.id) || null; }
  function rankRows(rows){ return [...rows].sort((a,b)=>b.total-b.total || b.wins-a.wins || a.name.localeCompare(b.name)); }

  function getUniqueLeaderAndLast(rows){
    const sorted=rankRows(rows);
    if(!sorted.length) return {leader:null,last:null,hasClearLeader:false,hasClearLast:false};
    const leader=sorted[0]; const last=sorted[sorted.length-1];
    const hasClearLeader = sorted.filter((r)=>r.total===leader.total).length===1;
    const hasClearLast = sorted.filter((r)=>r.total===last.total).length===1;
    return {leader,last,hasClearLeader,hasClearLast};
  }

  function recalculateRanking() {
    const players = lobby.players.map((name)=>({name,total:0,base:0,bonus:0,wins:0}));
    let previousFfaWinners = new Set(); let playedGames = 0;

    lobby.games.forEach((game, index)=>{
      const result = getResultForGame(game); if(!result) return;
      result.adjustments = [];
      const mult = lobby.extraRules.finalDoublePoints && index===lobby.games.length-1 ? 2 : 1;

      if(game.mode==='ffa'){
        const before = getUniqueLeaderAndLast(players);
        const grouped = {1:[],2:[],3:[]};
        (result.placements || []).forEach((p)=>{ if(grouped[p.place]) grouped[p.place].push(p.player); });
        const top3Set = new Set([...grouped[1],...grouped[2],...grouped[3]]);

        [[1,3],[2,2],[3,1]].forEach(([place,pts])=>{ grouped[place].forEach((player)=>{ const row=players.find((r)=>r.name===player); if(!row) return; row.base += pts*mult; row.total += pts*mult; if(place===1) row.wins += 1; }); });

        if(playedGames>0 && lobby.extraRules.comebackPenalty && before.hasClearLeader && !top3Set.has(before.leader.name)){ const row=players.find((r)=>r.name===before.leader.name); if(row){ row.bonus -=2; row.total -=2; result.adjustments.push({player:row.name,points:-2,rule:'Comeback-Regel'}); } }
        if(playedGames>0 && lobby.extraRules.lastPlaceBonus && before.hasClearLast && top3Set.has(before.last.name)){ const row=players.find((r)=>r.name===before.last.name); if(row){ row.bonus +=1; row.total +=1; result.adjustments.push({player:row.name,points:+1,rule:'Letzter-Holt-Auf-Regel'}); } }

        const firstSet = new Set(grouped[1]);
        if(lobby.extraRules.winStreakBonus){ firstSet.forEach((player)=>{ if(previousFfaWinners.has(player)){ const row=players.find((r)=>r.name===player); if(row){ row.bonus +=1; row.total +=1; result.adjustments.push({player:row.name,points:+1,rule:'Sieges-Serie-Regel'}); } } }); }
        previousFfaWinners = firstSet;
      } else {
        const teamA = Array.isArray(result.teamA) ? result.teamA : [];
        const teamB = Array.isArray(result.teamB) ? result.teamB : [];
        teamA.forEach((p)=>{const row=players.find((r)=>r.name===p); if(!row) return; const pts=result.winnerTeam==='A'?2*mult:0; row.base+=pts; row.total+=pts; if(pts>0) row.wins+=1;});
        teamB.forEach((p)=>{const row=players.find((r)=>r.name===p); if(!row) return; const pts=result.winnerTeam==='B'?2*mult:0; row.base+=pts; row.total+=pts; if(pts>0) row.wins+=1;});
      }
      playedGames += 1;
    });

    return rankRows(players);
  }

  function renderProgress() {
    const total = lobby.games.length;
    const validGameIds = new Set(lobby.games.map((g) => g.id));
    const played = lobby.results.filter((r) => validGameIds.has(r.gameId)).length;
    const percent = total > 0 ? Math.round((played / total) * 100) : 0;
    const filled = Math.round(percent / 10);
    const bar = '█'.repeat(filled) + '░'.repeat(10 - filled);

    document.getElementById('progressText').innerText = `Fortschritt: ${bar} ${percent}%`;
    document.getElementById('progressDetail').innerText = `Spiel ${played} von ${total}`;

    const game = selectedGame();
    document.getElementById('currentGame').innerText = game ? `Aktuelles Spiel: ${game.icon} ${game.name}` : 'Aktuelles Spiel: -';
  }

  function renderRanking(){
    const rows = recalculateRanking();
    const body = document.getElementById('rankingBody');
    body.innerHTML = '';
    rows.forEach((r,i)=>{
      const tr=document.createElement('tr');
      if(i===0) tr.className='top1'; else if(i===1) tr.className='top2'; else if(i===2) tr.className='top3';
      tr.innerHTML=`<td>${i+1}</td><td>${r.name}</td><td>${r.total}</td><td>${r.base}</td><td>${r.bonus>0?'+':''}${r.bonus}</td><td>${r.wins}</td>`;
      body.appendChild(tr);
    });
    renderLog(); renderProgress(); saveLobby();
  }

  function renderLog(){
    const area=document.getElementById('logArea'); area.innerHTML='';
    const entries=lobby.results.filter((r)=>Array.isArray(r.adjustments)&&r.adjustments.length);
    if(!entries.length){area.innerText='Noch keine Bonus-/Malus-Regel ausgelöst.'; return;}
    entries.forEach((r)=>{ const div=document.createElement('div');div.className='log-item';div.innerHTML=`<strong>${r.game}</strong><br>${r.adjustments.map((a)=>`${a.player}: ${a.points>0?'+':''}${a.points} (${a.rule})`).join('<br>')}`; area.appendChild(div); });
  }

  function fillGames(){
    const select=document.getElementById('gameSelect');
    select.innerHTML='<option value="">Spiel auswählen</option>';
    lobby.games.forEach((g)=>{ select.innerHTML += `<option value="${g.id}">${g.icon} ${g.name} (${g.mode.toUpperCase()})</option>`; });
  }

  function selectedGame(){ const id=document.getElementById('gameSelect').value; return lobby.games.find((g)=>g.id===id) || null; }

  function renderForm(){
    showError('');
    const area=document.getElementById('formArea'); area.innerHTML='';
    const hint=document.getElementById('hint');
    const game=selectedGame();
    if(!game){ hint.innerText=''; renderProgress(); return; }
    const old=getResultForGame(game); renderProgress();

    if(game.mode==='ffa'){
      if(lobby.tieRule==='tiebreaker'){
        hint.innerText='Bei Gleichstand bitte Schätzfrage stellen und danach eindeutige Platzierung eintragen.';
        for(let place=1; place<=3; place++){
          const s=document.createElement('select'); s.id=`ffa_${place}`;
          s.innerHTML=`<option value="">${place}. Platz ${place===1?'(Pflicht)':''}</option>`;
          lobby.players.forEach((p)=> s.innerHTML += `<option value="${p}">${p}</option>`);
          const v=old?.placements?.find((x)=>x.place===place)?.player; if(v) s.value=v;
          area.appendChild(s);
        }
      } else {
        hint.innerText='Gleiche Punkte vergeben aktiv: mehrere Spieler pro Platz erlaubt.';
        for(let place=1; place<=3; place++){
          const box=document.createElement('div'); box.className='place-box'; box.innerHTML=`<strong>${place}. Platz</strong>`;
          lobby.players.forEach((p,idx)=>{ const checked = !!old?.placements?.find((x)=>x.place===place && x.player===p); box.innerHTML += `<label class="player-check"><input type="checkbox" id="p_${place}_${idx}" ${checked?'checked':''}/> ${p}</label>`; });
          area.appendChild(box);
        }
      }
    } else {
      hint.innerText='Alle Spieler müssen Team A oder Team B zugewiesen sein.';
      lobby.players.forEach((p,idx)=>{
        const sel=document.createElement('select'); sel.id=`team_${idx}`;
        sel.innerHTML='<option value="A">Team A</option><option value="B">Team B</option>';
        if(old?.teamA?.includes(p)) sel.value='A'; if(old?.teamB?.includes(p)) sel.value='B';
        const wrap=document.createElement('div'); wrap.className='place-box'; wrap.innerHTML=`<strong>${p}</strong>`; wrap.appendChild(sel);
        area.appendChild(wrap);
      });
      const winner=document.createElement('select'); winner.id='winnerTeam'; winner.innerHTML='<option value="">Gewinner-Team wählen</option><option value="A">Team A gewinnt</option><option value="B">Team B gewinnt</option>';
      if(old?.winnerTeam) winner.value=old.winnerTeam;
      area.appendChild(winner);
    }
  }

  function collectFfaPlacements(){
    if(lobby.tieRule==='tiebreaker'){
      const first=document.getElementById('ffa_1').value; const second=document.getElementById('ffa_2').value; const third=document.getElementById('ffa_3').value;
      if(!first) return {error:'FFA: Platz 1 ist Pflicht.'};
      const picks=[first,second,third].filter(Boolean);
      if(new Set(picks).size!==picks.length) return {error:'FFA: Spieler darf nicht doppelt vorkommen.'};
      return {placements:[first?{place:1,player:first}:null,second?{place:2,player:second}:null,third?{place:3,player:third}:null].filter(Boolean)};
    }

    const placements=[]; const selectedByPlayer = new Set();
    for(let place=1; place<=3; place++){
      lobby.players.forEach((p,idx)=>{ const checked=document.getElementById(`p_${place}_${idx}`).checked; if(!checked) return; if(selectedByPlayer.has(p)) return; selectedByPlayer.add(p); placements.push({place,player:p}); });
    }

    const place1Count=placements.filter((p)=>p.place===1).length;
    if(place1Count===0) return {error:'FFA: Platz 1 ist Pflicht.'};

    const allPlayers=placements.map((p)=>p.player);
    if(new Set(allPlayers).size!==allPlayers.length) return {error:'FFA: Spieler darf nicht auf mehreren Plätzen sein.'};

    return {placements};
  }

  function saveResult(){
    showError('');
    const game=selectedGame(); if(!game) return showError('Bitte zuerst ein Spiel auswählen.');
    const btn=document.getElementById('saveBtn'); btn.disabled=true;

    if(game.mode==='ffa'){
      const out=collectFfaPlacements();
      if(out.error){ btn.disabled=false; return showError(out.error); }
      lobby.results = lobby.results.filter((r)=>r.gameId!==game.id);
      lobby.results.push({gameId:game.id,game:game.name,mode:'ffa',placements:out.placements,adjustments:[]});
    } else {
      const teamA=[]; const teamB=[];
      lobby.players.forEach((p,idx)=>{ const v=document.getElementById(`team_${idx}`).value; if(v==='A') teamA.push(p); else teamB.push(p); });
      if(teamA.length===0 || teamB.length===0){ btn.disabled=false; return showError('Team A und Team B dürfen nicht leer sein.'); }
      if(teamA.length + teamB.length !== lobby.players.length){ btn.disabled=false; return showError('Alle Spieler müssen exakt einem Team zugeordnet sein.'); }
      const overlap = teamA.filter((p)=>teamB.includes(p));
      if(overlap.length){ btn.disabled=false; return showError('Team A und Team B dürfen sich nicht überschneiden.'); }
      const winnerTeam=document.getElementById('winnerTeam').value;
      if(!winnerTeam){ btn.disabled=false; return showError('Bitte Gewinner-Team auswählen.'); }
      lobby.results = lobby.results.filter((r)=>r.gameId!==game.id);
      lobby.results.push({gameId:game.id,game:game.name,mode:'team',teamA,teamB,winnerTeam,placements:[],adjustments:[]});
    }

    renderRanking(); btn.disabled=false;
  }

  function resetResults(){ if(!confirm('Wirklich alle Ergebnisse löschen?')) return; lobby.results=[]; renderRanking(); renderForm(); }

  function pickRandomGame(){
    const available = lobby.games.filter((g)=>!lobby.results.some((r)=>r.gameId===g.id));
    const pool = available.length ? available : lobby.games;
    if(!pool.length) return;
    const chosen = pool[Math.floor(Math.random()*pool.length)];
    document.getElementById('gameSelect').value = chosen.id;
    renderForm();
    const box = document.getElementById('randomResult');
    box.classList.add('spin');
    box.innerText = `Random-Spiel: ${chosen.icon} ${chosen.name} (${chosen.mode.toUpperCase()})`;
    setTimeout(()=>box.classList.remove('spin'), 900);
  }

  normalizeLobby();
  if(!lobby.games.length){ alert('Bitte zuerst mindestens ein Spiel anlegen.'); window.location.href='games.html?code='+lobby.code; }
  document.getElementById('lobbyName').innerText=lobby.lobbyName;
  document.getElementById('backToGames').href='games.html?code='+lobby.code;
  fillGames(); renderForm(); renderRanking();
</script>
</body>
</html>
