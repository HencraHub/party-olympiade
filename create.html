<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby erstellen | Party Olympiade</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #1a1a2e, #090914); color: white; text-align: center; }
    .container { max-width: 560px; margin: auto; padding: 60px 20px; }
    input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; border: 1px solid #333; background: #151528; color: white; box-sizing: border-box; }
    .rules { text-align: left; background: #151528; border-radius: 14px; padding: 12px; margin-top: 12px; }
    .rule-item { display: flex; gap: 8px; margin: 8px 0; color: #d4d4ea; font-size: 14px; }
    button { width: 100%; padding: 15px; margin-top: 14px; border-radius: 30px; border: none; font-weight: bold; background: linear-gradient(45deg, #8b5cf6, #ec4899); color: white; }
    .error { color: #fb7185; font-size: 14px; min-height: 18px; margin-top: 8px; }
    a { display: block; margin-top: 20px; color: #22d3ee; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lobby erstellen</h1>
    <input id="lobbyName" placeholder="Name der Olympiade" />
    <input id="hostName" placeholder="Dein Name" maxlength="20" />

    <select id="tieRule">
      <option value="tiebreaker">Gleichstand: Schätzfrage entscheidet</option>
      <option value="shared_points">Gleichstand: Gleiche Punkte vergeben</option>
    </select>

    <div class="rules">
      <strong>Optionale Extra-Regeln (nur FFA außer Finale-Doppelt)</strong>
      <label class="rule-item"><input type="checkbox" id="rComeback" /> Comeback-Regel (-2 wenn vorheriger Führender nicht Top 3)</label>
      <label class="rule-item"><input type="checkbox" id="rLast" /> Letzter-Holt-Auf-Regel (+1 wenn vorher Letzter Top 3 erreicht)</label>
      <label class="rule-item"><input type="checkbox" id="rStreak" /> Sieges-Serie-Regel (+1 bei 2 FFA-Siegen in Folge)</label>
      <label class="rule-item"><input type="checkbox" id="rFinal" /> Finale-Doppelt-Regel (letztes Spiel doppelte Grundpunkte)</label>
    </div>

    <div id="error" class="error"></div>
    <button onclick="createLobby()">Party starten</button>
    <a href="index.html">← Zur Startseite</a>
  </div>

  <script>
    function showError(message) { document.getElementById("error").innerText = message || ""; }

    function generateLobbyCode() {
      let code = "";
      do { code = Math.random().toString(36).slice(2, 6).toUpperCase(); }
      while (localStorage.getItem("party_olympiade_" + code));
      return code;
    }

    function createLobby() {
      showError("");
      const lobbyName = document.getElementById("lobbyName").value.trim();
      const hostName = document.getElementById("hostName").value.trim();
      const tieRule = document.getElementById("tieRule").value;

      if (!lobbyName) return showError("Bitte Name der Olympiade eingeben.");
      if (!hostName) return showError("Bitte deinen Namen eingeben.");
      if (hostName.length > 20) return showError("Host-Name darf maximal 20 Zeichen lang sein.");

      const lobby = {
        code: generateLobbyCode(),
        lobbyName,
        hostName,
        players: [hostName],
        games: [],
        results: [],
        tieRule: tieRule || "tiebreaker",
        extraRules: {
          comebackPenalty: document.getElementById("rComeback").checked,
          lastPlaceBonus: document.getElementById("rLast").checked,
          winStreakBonus: document.getElementById("rStreak").checked,
          finalDoublePoints: document.getElementById("rFinal").checked
        }
      };

      localStorage.setItem("party_olympiade_" + lobby.code, JSON.stringify(lobby));
      localStorage.setItem("party_olympiade_last_code", lobby.code);
      window.location.href = "lobby.html?code=" + lobby.code;
    }
  </script>
</body>
</html>
