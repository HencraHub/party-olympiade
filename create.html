<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby erstellen | Party Olympiade</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="page">
    <header class="header glass">
      <a href="index.html" aria-label="Startseite">
        <img class="brand-logo" src="assets/logo-party-olympiade.png" alt="Party Olympiade" />
      </a>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html#features">Features</a>
        <a href="index.html#how">So funktioniert’s</a>
        <a href="index.html#rules">Regeln</a>
      </nav>
      <div>
        <a class="btn btn-secondary" href="index.html">Zurück zur Startseite</a>
      </div>
    </header>

    <section class="setup-wrap">
      <div class="setup glass">
        <div class="panel">
          <h1>Erstelle deine Olympiade</h1>
          <p class="lead">Lege Name, Host und Regeln fest. Danach bekommst du deinen Lobby-Code.</p>
          <ul class="info-list">
            <li><span class="dot"></span>Kein Login</li>
            <li><span class="dot"></span>Host steuert die Runde</li>
            <li><span class="dot"></span>Regeln später sichtbar</li>
          </ul>
        </div>

        <div class="panel">
          <form onsubmit="event.preventDefault(); createLobby();">
            <div class="field">
              <label for="lobbyName">Name der Olympiade</label>
              <input id="lobbyName" type="text" placeholder="z. B. Sommer-Spezial 2026" />
            </div>

            <div class="field">
              <label for="hostName">Dein Name</label>
              <input id="hostName" type="text" maxlength="20" placeholder="Dein Host-Name" />
            </div>

            <div class="field">
              <span class="section-title">Gleichstandsregel</span>
              <select id="tieRule" aria-label="Gleichstandsregel">
                <option value="tiebreaker">Gleichstand: Schätzfrage entscheidet</option>
                <option value="shared_points">Gleichstand: Gleiche Punkte vergeben</option>
              </select>
              <div class="tie-cards">
                <button type="button" class="choice-card active" data-tie-rule="tiebreaker">
                  <strong>Schätzfrage entscheidet</strong>
                  <span>Bei Punktgleichstand entscheidet eine zusätzliche Schätzfrage.</span>
                </button>
                <button type="button" class="choice-card" data-tie-rule="shared_points">
                  <strong>Gleiche Punkte vergeben</strong>
                  <span>Alle beteiligten Teams erhalten die gleiche Platzierungspunktzahl.</span>
                </button>
              </div>
            </div>

            <div class="field">
              <span class="section-title">Extra-Regeln</span>
              <div class="toggle-grid">
                <label class="toggle-card" for="rComeback">
                  <input type="checkbox" id="rComeback" />
                  <strong>Comeback-Regel</strong>
                  <span>-2, wenn vorheriger Führender nicht Top 3 erreicht.</span>
                </label>
                <label class="toggle-card" for="rLast">
                  <input type="checkbox" id="rLast" />
                  <strong>Letzter-holt-auf</strong>
                  <span>+1, wenn vorher Letzter jetzt Top 3 erreicht.</span>
                </label>
                <label class="toggle-card" for="rStreak">
                  <input type="checkbox" id="rStreak" />
                  <strong>Sieges-Serie</strong>
                  <span>+1 bei zwei FFA-Siegen in Folge.</span>
                </label>
                <label class="toggle-card" for="rFinal">
                  <input type="checkbox" id="rFinal" />
                  <strong>Finale doppelt</strong>
                  <span>Letztes Spiel zählt mit doppelten Grundpunkten.</span>
                </label>
              </div>
            </div>

            <div id="error" class="error"></div>

            <div class="button-row">
              <button class="btn btn-primary" type="submit">Lobby erstellen</button>
            </div>

            <a class="back-link" href="index.html">← Zurück zur Startseite</a>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script>
    function showError(message) { document.getElementById("error").innerText = message || ""; }

    function generateLobbyCode() {
      let code = "";
      do { code = Math.random().toString(36).slice(2, 6).toUpperCase(); }
      while (localStorage.getItem("party_olympiade_" + code));
      return code;
    }

    function createLobby() {
      showError("");
      const lobbyName = document.getElementById("lobbyName").value.trim();
      const hostName = document.getElementById("hostName").value.trim();
      const tieRule = document.getElementById("tieRule").value;

      if (!lobbyName) return showError("Bitte Name der Olympiade eingeben.");
      if (!hostName) return showError("Bitte deinen Namen eingeben.");
      if (hostName.length > 20) return showError("Host-Name darf maximal 20 Zeichen lang sein.");

      const lobby = {
        code: generateLobbyCode(),
        lobbyName,
        hostName,
        players: [hostName],
        games: [],
        results: [],
        tieRule: tieRule || "tiebreaker",
        extraRules: {
          comebackPenalty: document.getElementById("rComeback").checked,
          lastPlaceBonus: document.getElementById("rLast").checked,
          winStreakBonus: document.getElementById("rStreak").checked,
          finalDoublePoints: document.getElementById("rFinal").checked
        }
      };

      localStorage.setItem("party_olympiade_" + lobby.code, JSON.stringify(lobby));
      localStorage.setItem("party_olympiade_last_code", lobby.code);
      window.location.href = "lobby.html?code=" + lobby.code;
    }

    const tieRuleSelect = document.getElementById("tieRule");
    const tieCards = Array.from(document.querySelectorAll(".choice-card"));

    tieCards.forEach((card) => {
      card.addEventListener("click", () => {
        tieCards.forEach((item) => item.classList.remove("active"));
        card.classList.add("active");
        tieRuleSelect.value = card.dataset.tieRule;
      });
    });

    const toggleCards = Array.from(document.querySelectorAll(".toggle-card"));
    toggleCards.forEach((card) => {
      const input = card.querySelector("input[type='checkbox']");
      const sync = () => card.classList.toggle("active", input.checked);
      input.addEventListener("change", sync);
      sync();
    });
  </script>
</body>
</html>
