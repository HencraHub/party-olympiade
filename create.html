<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby erstellen | Party Olympiade</title>
  <style>
    :root {
      --bg: #070714;
      --bg2: #0d1024;
      --panel: rgba(18, 18, 36, 0.8);
      --panel2: rgba(28, 28, 56, 0.58);
      --border: rgba(255, 255, 255, 0.12);
      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --text: #ffffff;
      --muted: #b7bbcc;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 720px at 8% 0%, rgba(236, 72, 153, 0.22), transparent 70%),
        radial-gradient(1240px 760px at 92% 6%, rgba(34, 211, 238, 0.2), transparent 72%),
        linear-gradient(166deg, var(--bg2), var(--bg));
      overflow-x: hidden;
    }

    .page {
      width: min(1540px, 96vw);
      margin: 30px auto 40px;
    }

    .glass {
      border: 1px solid var(--border);
      background:
        linear-gradient(138deg, var(--panel), var(--panel2)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 36%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .header {
      min-height: 98px;
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 16px 26px;
      position: relative;
    }

    .header::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(108deg, rgba(236, 72, 153, 0.28), transparent 34%, rgba(34, 211, 238, 0.26));
      filter: blur(18px);
      opacity: 0.58;
      z-index: -1;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }

    .brand-logo {
      height: clamp(58px, 5vw, 68px);
      width: auto;
      max-height: 68px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(236, 72, 153, 0.18));
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #c5c8d6;
      text-decoration: none;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 999px;
      transition: color 0.22s ease, background-color 0.22s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .header-cta {
      justify-self: end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      padding: 14px 26px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: scale(1.03);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(100deg, rgba(139, 92, 246, 0.95), rgba(236, 72, 153, 0.96));
      box-shadow: 0 0 42px rgba(236, 72, 153, 0.72), 0 0 74px rgba(139, 92, 246, 0.48);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      box-shadow: 0 0 58px rgba(236, 72, 153, 0.88), 0 0 94px rgba(139, 92, 246, 0.62);
    }

    .btn-secondary {
      color: var(--cyan);
      border-color: rgba(34, 211, 238, 0.64);
      background: linear-gradient(120deg, rgba(34, 211, 238, 0.1), rgba(34, 211, 238, 0.04));
      box-shadow: 0 0 34px rgba(34, 211, 238, 0.3);
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      border-color: rgba(34, 211, 238, 0.9);
      box-shadow: 0 0 46px rgba(34, 211, 238, 0.56);
    }

    .setup-wrap {
      margin-top: 34px;
      position: relative;
      border-radius: 34px;
      overflow: visible;
    }

    .setup-wrap::before {
      content: "";
      position: absolute;
      inset: -120px -70px;
      z-index: -1;
      background:
        radial-gradient(980px 580px at 16% 20%, rgba(236, 72, 153, 0.32), transparent 72%),
        radial-gradient(980px 580px at 88% 68%, rgba(34, 211, 238, 0.3), transparent 72%),
        radial-gradient(860px 520px at 56% 46%, rgba(139, 92, 246, 0.3), transparent 72%);
      filter: blur(48px);
      opacity: 0.9;
      pointer-events: none;
    }

    .setup {
      display: grid;
      grid-template-columns: 42% 58%;
      gap: 28px;
      border-radius: 34px;
      padding: 40px;
      min-height: 680px;
      position: relative;
      overflow: visible;
    }

    .panel {
      border-radius: 28px;
      position: relative;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background:
        linear-gradient(145deg, rgba(16, 16, 36, 0.85), rgba(24, 24, 52, 0.56));
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.16), 0 0 40px rgba(236, 72, 153, 0.14);
    }

    .panel h1 {
      margin: 0;
      font-size: clamp(42px, 4vw, 58px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 18px 0 28px;
      color: var(--muted);
      line-height: 1.68;
      font-size: 1.05rem;
      max-width: 38ch;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    .info-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(18, 18, 37, 0.7);
      color: #d6dbeb;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 9px;
      background: linear-gradient(135deg, var(--pink), var(--cyan));
      box-shadow: 0 0 14px rgba(236, 72, 153, 0.7), 0 0 20px rgba(34, 211, 238, 0.5);
    }

    form {
      display: grid;
      gap: 20px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label,
    .section-title {
      font-size: 0.95rem;
      color: #d3d8e8;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #fff;
      background: rgba(9, 10, 24, 0.68);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: rgba(34, 211, 238, 0.8);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2), 0 0 22px rgba(34, 211, 238, 0.28);
    }

    .tie-cards,
    .toggle-grid {
      display: grid;
      gap: 12px;
    }

    .tie-cards {
      grid-template-columns: 1fr 1fr;
    }

    .toggle-grid {
      grid-template-columns: 1fr 1fr;
    }

    .choice-card,
    .toggle-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: left;
      color: #dbe0ee;
      background: rgba(14, 14, 30, 0.66);
      cursor: pointer;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.16s ease;
      user-select: none;
    }

    .choice-card:hover,
    .toggle-card:hover {
      border-color: rgba(34, 211, 238, 0.56);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.2);
      transform: translateY(-1px);
    }

    .choice-card strong,
    .toggle-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.97rem;
      color: #f8fbff;
    }

    .choice-card span,
    .toggle-card span {
      font-size: 0.84rem;
      color: #aeb4c7;
      line-height: 1.45;
    }

    .choice-card.active {
      border-color: rgba(236, 72, 153, 0.78);
      background: linear-gradient(150deg, rgba(236, 72, 153, 0.2), rgba(17, 16, 33, 0.84));
      box-shadow: 0 0 26px rgba(236, 72, 153, 0.38), 0 0 30px rgba(139, 92, 246, 0.26);
    }

    .toggle-card input {
      display: none;
    }

    .toggle-card.active {
      border-color: rgba(34, 211, 238, 0.82);
      background: linear-gradient(150deg, rgba(34, 211, 238, 0.18), rgba(16, 17, 36, 0.84));
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.34);
    }

    .error {
      min-height: 20px;
      margin-top: -4px;
      font-size: 0.93rem;
      color: var(--danger);
    }

    .button-row {
      display: flex;
      justify-content: flex-start;
      margin-top: 2px;
    }

    .button-row .btn {
      min-width: 280px;
      padding: 16px 34px;
      font-size: 1.03rem;
    }

    .back-link {
      margin-top: 10px;
      display: inline-flex;
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }

    #tieRule {
      display: none;
    }

    @media (max-width: 1100px) {
      .header {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .header-cta {
        justify-self: center;
      }

      .setup {
        grid-template-columns: 1fr;
      }

      .panel h1 {
        font-size: clamp(34px, 7vw, 48px);
      }

      .tie-cards,
      .toggle-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header glass">
      <a class="brand" href="index.html" aria-label="Startseite">
        <img class="brand-logo" src="assets/logo-party-olympiade.png" alt="Party Olympiade" />
      </a>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html#features">Features</a>
        <a href="index.html#games">Spiele</a>
        <a href="index.html#how">Ablauf</a>
      </nav>
      <div class="header-cta">
        <a class="btn btn-secondary" href="index.html">Zurück zur Startseite</a>
      </div>
    </header>

    <section class="setup-wrap">
      <div class="setup glass">
        <div class="panel">
          <h1>Erstelle deine Olympiade</h1>
          <p class="lead">Lege Name, Host und Regeln fest. Danach bekommst du deinen Lobby-Code.</p>
          <ul class="info-list">
            <li><span class="dot"></span>Kein Login</li>
            <li><span class="dot"></span>Host steuert die Runde</li>
            <li><span class="dot"></span>Regeln später sichtbar</li>
          </ul>
        </div>

        <div class="panel">
          <form onsubmit="event.preventDefault(); createLobby();">
            <div class="field">
              <label for="lobbyName">Name der Olympiade</label>
              <input id="lobbyName" type="text" placeholder="z. B. Sommer-Spezial 2026" />
            </div>

            <div class="field">
              <label for="hostName">Dein Name</label>
              <input id="hostName" type="text" maxlength="20" placeholder="Dein Host-Name" />
            </div>

            <div class="field">
              <span class="section-title">Gleichstandsregel</span>
              <select id="tieRule" aria-label="Gleichstandsregel">
                <option value="tiebreaker">Gleichstand: Schätzfrage entscheidet</option>
                <option value="shared_points">Gleichstand: Gleiche Punkte vergeben</option>
              </select>
              <div class="tie-cards">
                <button type="button" class="choice-card active" data-tie-rule="tiebreaker">
                  <strong>Schätzfrage entscheidet</strong>
                  <span>Bei Punktgleichstand entscheidet eine zusätzliche Schätzfrage.</span>
                </button>
                <button type="button" class="choice-card" data-tie-rule="shared_points">
                  <strong>Gleiche Punkte vergeben</strong>
                  <span>Alle beteiligten Teams erhalten die gleiche Platzierungspunktzahl.</span>
                </button>
              </div>
            </div>

            <div class="field">
              <span class="section-title">Extra-Regeln</span>
              <div class="toggle-grid">
                <label class="toggle-card" for="rComeback">
                  <input type="checkbox" id="rComeback" />
                  <strong>Comeback-Regel</strong>
                  <span>-2, wenn vorheriger Führender nicht Top 3 erreicht.</span>
                </label>
                <label class="toggle-card" for="rLast">
                  <input type="checkbox" id="rLast" />
                  <strong>Letzter-holt-auf</strong>
                  <span>+1, wenn vorher Letzter jetzt Top 3 erreicht.</span>
                </label>
                <label class="toggle-card" for="rStreak">
                  <input type="checkbox" id="rStreak" />
                  <strong>Sieges-Serie</strong>
                  <span>+1 bei zwei FFA-Siegen in Folge.</span>
                </label>
                <label class="toggle-card" for="rFinal">
                  <input type="checkbox" id="rFinal" />
                  <strong>Finale doppelt</strong>
                  <span>Letztes Spiel zählt mit doppelten Grundpunkten.</span>
                </label>
              </div>
            </div>

            <div id="error" class="error"></div>

            <div class="button-row">
              <button class="btn btn-primary" type="submit">Lobby erstellen</button>
            </div>

            <a class="back-link" href="index.html">← Zurück zur Startseite</a>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script>
    function showError(message) { document.getElementById("error").innerText = message || ""; }

    function generateLobbyCode() {
      let code = "";
      do { code = Math.random().toString(36).slice(2, 6).toUpperCase(); }
      while (localStorage.getItem("party_olympiade_" + code));
      return code;
    }

    function createLobby() {
      showError("");
      const lobbyName = document.getElementById("lobbyName").value.trim();
      const hostName = document.getElementById("hostName").value.trim();
      const tieRule = document.getElementById("tieRule").value;

      if (!lobbyName) return showError("Bitte Name der Olympiade eingeben.");
      if (!hostName) return showError("Bitte deinen Namen eingeben.");
      if (hostName.length > 20) return showError("Host-Name darf maximal 20 Zeichen lang sein.");

      const lobby = {
        code: generateLobbyCode(),
        lobbyName,
        hostName,
        players: [hostName],
        games: [],
        results: [],
        tieRule: tieRule || "tiebreaker",
        extraRules: {
          comebackPenalty: document.getElementById("rComeback").checked,
          lastPlaceBonus: document.getElementById("rLast").checked,
          winStreakBonus: document.getElementById("rStreak").checked,
          finalDoublePoints: document.getElementById("rFinal").checked
        }
      };

      localStorage.setItem("party_olympiade_" + lobby.code, JSON.stringify(lobby));
      localStorage.setItem("party_olympiade_last_code", lobby.code);
      window.location.href = "lobby.html?code=" + lobby.code;
    }

    const tieRuleSelect = document.getElementById("tieRule");
    const tieCards = Array.from(document.querySelectorAll(".choice-card"));

    tieCards.forEach((card) => {
      card.addEventListener("click", () => {
        tieCards.forEach((item) => item.classList.remove("active"));
        card.classList.add("active");
        tieRuleSelect.value = card.dataset.tieRule;
      });
    });

    const toggleCards = Array.from(document.querySelectorAll(".toggle-card"));
    toggleCards.forEach((card) => {
      const input = card.querySelector("input[type='checkbox']");
      const sync = () => card.classList.toggle("active", input.checked);
      input.addEventListener("change", sync);
      sync();
    });
  </script>
</body>
</html>
