<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby erstellen | Party Olympiade</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a2e, #090914);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.5rem;
    }

    input, select {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 16px;
      border: 1px solid #333;
      background: #151528;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      background: linear-gradient(45deg, #8B5CF6, #EC4899);
      color: white;
    }

    a {
      display: block;
      margin-top: 30px;
      color: #8B5CF6;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Lobby erstellen</h1>

    <input id="lobbyName" placeholder="Name der Olympiade" />
    <input id="hostName" placeholder="Dein Name" />

    <select id="rules">
      <option value="top3">Top 3: 5 / 3 / 1 Punkte</option>
      <option value="all">Alle Plätze zählen</option>
      <option value="winner">Nur Sieger bekommt Punkt</option>
    </select>

    <button onclick="createLobby()">Party starten</button>

    <a href="index.html">Zurück zur Startseite</a>
  </div>

  <script>
    function createLobby() {
      const lobbyName = document.getElementById("lobbyName").value.trim();
      const hostName = document.getElementById("hostName").value.trim();
      const rules = document.getElementById("rules").value;

      if (!lobbyName || !hostName) {
        alert("Bitte Lobby-Name und deinen Namen eingeben.");
        return;
      }

      const code = Math.random().toString(36).substring(2, 6).toUpperCase();

      const lobby = {
        code,
        lobbyName,
        hostName,
        rules,
        players: [hostName],
        games: [],
        results: []
      };

      localStorage.setItem("party_olympiade_" + code, JSON.stringify(lobby));
      localStorage.setItem("party_olympiade_last_code", code);

      window.location.href = "lobby.html?code=" + code;
    }
  </script>
</body>
</html>
