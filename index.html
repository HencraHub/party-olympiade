<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Party Olympiade</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #1a1a2e, #090914); color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .container { width: min(700px, 100%); padding: 40px 20px; text-align: center; margin: auto; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 10px; }
    p { color: #bcbcd1; max-width: 520px; margin: 0 auto 30px; line-height: 1.5; }
    .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    button { padding: 16px 26px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; font-weight: bold; min-width: 220px; }
    .primary { background: linear-gradient(45deg, #8b5cf6, #ec4899); color: white; }
    .secondary { background: transparent; border: 2px solid #22d3ee; color: #22d3ee; }
    .logo { font-size: 20px; color: #8b5cf6; margin-bottom: 36px; letter-spacing: 1px; font-weight: bold; }
    footer { text-align: center; padding: 16px; color: #a8a8c8; font-size: 14px; }
    footer a { color: #22d3ee; text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PARTY OLYMPIADE</div>
    <h1>Deine Party. Eure Spiele. Ein Gewinner.</h1>
    <p>Erstelle in Sekunden eine eigene Spiele-Olympiade für Freunde, Geburtstage oder private Events. Ohne Login, nur lokal im Browser gespeichert.</p>
    <div class="buttons">
      <button class="primary" onclick="window.location.href='create.html'">Party starten</button>
      <button class="secondary" onclick="joinLobby()">Lobby beitreten</button>
    </div>
  </div>

  <footer>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>

  <script>
    function joinLobby() {
      const lastCode = localStorage.getItem("party_olympiade_last_code") || "";
      const value = prompt("Bitte Lobby-Code eingeben:", lastCode);
      const input = (value || "").trim().toUpperCase();
      if (!input) return;

      const lobby = localStorage.getItem("party_olympiade_" + input);
      if (!lobby) {
        alert("Keine Lobby mit diesem Code gefunden.");
        return;
      }

      window.location.href = "lobby.html?code=" + input;
    }
  </script>
</body>
</html>
