<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Party Olympiade</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a2e, #090914);
      color: white;
      text-align: center;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      max-width: 500px;
      margin: 0 auto 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 25px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: linear-gradient(45deg, #8B5CF6, #EC4899);
      color: white;
    }

    .secondary {
      background: transparent;
      border: 2px solid #8B5CF6;
      color: #8B5CF6;
    }

    .primary:hover {
      opacity: 0.9;
    }

    .secondary:hover {
      background: #8B5CF6;
      color: white;
    }

    .logo {
      font-size: 20px;
      color: #8B5CF6;
      margin-bottom: 40px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">PARTY OLYMPIADE</div>

    <h1>Deine Party. Eure Spiele. Ein Gewinner.</h1>

    <p>
      Erstelle in Sekunden eine eigene Spiele-Olympiade für Freunde,
      Geburtstage oder Events. Keine App. Kein Login.
    </p>

    <div class="buttons">
      <button class="primary">Party starten</button>
      <button class="secondary">Lobby beitreten</button>
    </div>
  </div>

</body>
</html>
